version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: freelance-copilot-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelance_copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai-server
    ports:
      - '11235:11235'
    environment:
      CRAWL4AI_LIMIT_GCLAIM: '10'
    deploy:
      resources:
        limits:
          memory: 2G
    shm_size: '2gb'
    restart: always

volumes:
  pgdata:
