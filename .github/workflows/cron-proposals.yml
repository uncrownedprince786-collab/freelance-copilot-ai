name: Proposal Count Sync (5 min)

# Keeps Upwork/Freelancer competition signals (proposals, interviewing, hires)
# fresh by forcing a sync every 5 minutes. The Vercel /api/sync endpoint applies
# an adaptive cooldown, so this run passes `force=true` to bypass it and actually
# re-fetch source data. A 429 (another sync still in progress) is treated as a
# benign skip rather than a failure.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Sync Endpoint (force)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sync-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/sync?force=true")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sync succeeded."
          elif [ "$HTTP_CODE" -eq 429 ]; then
            echo "Skipped: another sync is already in progress."
          else
            echo "::error::Sync endpoint returned HTTP $HTTP_CODE"
            cat /tmp/sync-response.json
            exit 1
          fi
          cat /tmp/sync-response.json
