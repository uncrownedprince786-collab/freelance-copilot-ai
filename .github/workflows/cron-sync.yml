name: Scheduled Sync + Refresh

on:
  schedule:
    # Single 30-minute coordinator (spec §6). Sync fetches new jobs; refresh
    # patches competition signals on active jobs. The 5-min gap lets the sync
    # commit before refresh reads.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sync-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/sync")
          echo "Sync HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sync succeeded."
          elif [ "$HTTP_CODE" -eq 429 ]; then
            echo "Skipped: another sync is already in progress (benign)."
          else
            echo "::error::Sync endpoint returned HTTP $HTTP_CODE"
            cat /tmp/sync-response.json
            exit 1
          fi
          cat /tmp/sync-response.json

      - name: Wait 5 minutes for sync to settle
        run: sleep 300

      - name: Trigger Refresh
        run: |
          HTTP_CODE=$(curl -s -o /tmp/refresh-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/sync/refresh")
          echo "Refresh HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Refresh succeeded."
          elif [ "$HTTP_CODE" -eq 429 ]; then
            echo "Skipped: another refresh is already in progress or inside cooldown."
          else
            echo "::error::Refresh endpoint returned HTTP $HTTP_CODE"
            cat /tmp/refresh-response.json
            exit 1
          fi
          cat /tmp/refresh-response.json
