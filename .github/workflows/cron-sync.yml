name: Scheduled Job Sync

on:
  schedule:
    # Fire every 20 minutes. The Vercel /api/sync endpoint applies an adaptive
    # cooldown from real posting data (~20 min during peak activity hours,
    # ~4 h otherwise), so this trigger is cheap and the actual source fetches
    # stay within the adaptive cadence.
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Sync Endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sync-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/sync")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sync succeeded."
          elif [ "$HTTP_CODE" -eq 429 ]; then
            echo "Skipped: another sync is already in progress (benign)."
          else
            echo "::error::Sync endpoint returned HTTP $HTTP_CODE"
            cat /tmp/sync-response.json
            exit 1
          fi
          cat /tmp/sync-response.json
