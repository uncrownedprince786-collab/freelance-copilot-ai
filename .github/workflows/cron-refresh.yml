name: Active Job Refresh (15 min)

# Separately keeps competition signals (proposals / interviewing / hires) fresh on
# EXISTING active jobs. This is independent of the new-job sync (cron-proposals.yml):
# it only patches already-stored listings, never ingests new ones. A 429 (another
# refresh still in progress, or inside the cooldown) is a benign skip.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Refresh Endpoint (force)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/refresh-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/sync/refresh?force=true")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Refresh succeeded."
          elif [ "$HTTP_CODE" -eq 429 ]; then
            echo "Skipped: another refresh is already in progress or inside cooldown."
          else
            echo "::error::Refresh endpoint returned HTTP $HTTP_CODE"
            cat /tmp/refresh-response.json
            exit 1
          fi
          cat /tmp/refresh-response.json
